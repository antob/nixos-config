# VPN status: bar indicator for the VPNs declared in
# antob.services.networkd-vpn (wg-quick and snx-rs). The VPN list and the menu
# command are generated by Nix into vpns.json next to this file.

id          = "antob/vpn-status"
name        = "VPN Status"
version     = "1.0.0"
plugin_api  = 3
author      = "antob"
license     = "MIT"
icon        = "shield-lock"
description = "Shows which networkd/snx-rs VPNs are active."
tags        = ["bar", "network", "privacy", "indicator"]

[[widget]]
id    = "bar"
entry = "widget.luau"

  [[widget.setting]]
  key             = "hide_inactive"
  type            = "bool"
  label_key       = "settings.hide_inactive.label"
  description_key = "settings.hide_inactive.description"
  default         = false

  [[widget.setting]]
  key             = "show_label"
  type            = "bool"
  label_key       = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default         = false

  [[widget.setting]]
  key             = "active_color"
  type            = "color"
  label_key       = "settings.active_color.label"
  description_key = "settings.active_color.description"
  default         = "primary"

  [[widget.setting]]
  key             = "inactive_color"
  type            = "color"
  label_key       = "settings.inactive_color.label"
  description_key = "settings.inactive_color.description"
  default         = "outline"

  [[widget.setting]]
  key             = "poll_interval_ms"
  type            = "int"
  label_key       = "settings.poll_interval_ms.label"
  description_key = "settings.poll_interval_ms.description"
  default         = 2000
  min             = 500
  max             = 60000
