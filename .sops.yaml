# To add a new server key
# ```
# # User ssh-to-pgp
# $ nix shell nixpkgs#ssh-to-pgp
# # Get server public key and fingerprint. Add fingerprint to this file.
# $ ssh hyllan.lan "sudo cat /etc/ssh/ssh_host_rsa_key" | ssh-to-pgp -o hosts/hyllan/public_key.asc -name hyllan -email tob@hyllan -comment "Host key for hyllan"
# => 26ed358df14249befc3b72618ff9d36f72f3e498 # Add this to keys list below
# # Import server public key
# $ gpg --import hosts/hyllan/public_key.asc
# # Re-encrypt common secrets to include new key
# $ sops updatekeys hosts/common/secrets.yaml
# ```
keys:
  - &admin A5D2C0275BBB60F60770159EC457E72EEC222C29
  - &laptob_fw c77129031f8a9816c85e351721d093c8d0b23661
  - &laptob b6834451ed652972c6e2dee8bcf1a546bb1b12b2
  - &desktob d0e37ed077fd839b70aa5e519d0652b758a631f8
  - &hyllan 26ed358df14249befc3b72618ff9d36f72f3e498
  - &wiggum 63195e56e676314ea266f7c2d4ea7781a7bada58
  - &pikvm be6a80f40335f59e9d4fe001ad1dbd2e3da906d8
  - &pihole 66ca420e1b65118bff214d00509ec5aed5fa6f86
  - &pidesk 93d069439d43e43b417715b82fc44d1ab4b9ae08

creation_rules:
  - path_regex: hosts/common/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *laptob_fw
          - *laptob
          - *desktob
          - *hyllan
          - *wiggum
          - *pikvm
          - *pihole
          - *pidesk
  - path_regex: hosts/hyllan/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *hyllan
  - path_regex: hosts/laptob-fw/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *laptob_fw
  - path_regex: hosts/laptob/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *laptob
  - path_regex: hosts/desktob/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *desktob
  - path_regex: hosts/wiggum/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *wiggum
  - path_regex: hosts/pikvm/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *pikvm
  - path_regex: hosts/pihole/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *pihole
  - path_regex: hosts/pidesk/secrets.yaml$
    key_groups:
      - pgp:
          - *admin
          - *pidesk
